<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Heredox</title>
<link rel="stylesheet" href="skins/classic/skin.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--table); overscroll-behavior: none; }
  body { font-family: var(--font-body); color: var(--ink); user-select: none; -webkit-user-select: none; touch-action: none; }
  #stage { position: fixed; left: 0; top: 0; }
  #bg { position: absolute; pointer-events: none; }
  #bg svg { display: block; width: 100%; height: 100%; }
  #stage.portrait { transform-origin: top left; transform: rotate(90deg) translateY(-100%); }

  #board { position: absolute; }
  #inner { position: absolute; left: 0; top: 0; transition: transform .5s ease; }
  .tile { position: absolute; width: var(--s); height: var(--s); padding: calc(var(--s) * .015); }
  .face { width: 100%; height: 100%; border-radius: 5%; overflow: hidden;
    background: radial-gradient(circle at 50% 50%, var(--tile-a), var(--tile-b));
    box-shadow: inset 0 0 0 1px var(--tile-edge), 0 1px 3px rgba(0,0,0,.5); }
  .face svg { display: block; width: 100%; height: 100%; }
  .slot { position: absolute; width: var(--s); height: var(--s); padding: calc(var(--s) * .06); pointer-events: none; }
  .slot i { display: block; width: 100%; height: 100%; border-radius: 6%; border: 1.5px dashed var(--ink-dim); opacity: .35; }
  #stage.dragging .slot i { opacity: .8; }
  .slot.target i { opacity: 1; border-style: solid; border-color: var(--accent); background: rgba(248,229,140,.12); }
  .glow { position: absolute; width: var(--s); height: var(--s); margin: calc(var(--s) * -.5) 0 0 calc(var(--s) * -.5);
    border-radius: 50%; pointer-events: none; animation: glow 1.1s ease-out forwards; }
  @keyframes glow { 0% { opacity: 0; transform: scale(.3); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.15); } }

  .float { z-index: 5; margin: calc(var(--s) * -.5) 0 0 calc(var(--s) * -.5); transition: left .45s ease, top .45s ease; touch-action: none; }
  .float .face { transition: transform .25s ease, box-shadow .2s; }
  .float.mine { cursor: grab; }
  .float.dragging { transition: none; z-index: 9; }
  .float.dragging .face { box-shadow: inset 0 0 0 1px var(--tile-edge), 0 10px 22px rgba(0,0,0,.55); }
  .float.arrive { animation: arrive .45s ease; }
  @keyframes arrive { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  .ghost { z-index: 4; pointer-events: none; opacity: .0; animation: ghost 2.6s ease forwards; }
  .ghost .face { box-shadow: 0 0 0 2px var(--accent), 0 0 18px var(--accent); }
  @keyframes ghost { 0% { opacity: 0; } 15% { opacity: .85; } 80% { opacity: .85; } 100% { opacity: 0; } }

  #side { position: absolute; right: 0; top: 0; height: 100%; display: flex; flex-direction: column; justify-content: space-between;
    align-items: stretch; padding: 1.1em 1.3em 1.1em .3em; }
  #side h1 { font-family: var(--font-display); font-weight: normal; font-size: 2.3em; line-height: 1; margin: 0; letter-spacing: .04em; text-align: center; }
  #scores { display: flex; flex-direction: column; gap: .4em; }
  .row { display: grid; grid-template-columns: 1.8em 1fr 2em 1.75em; align-items: center; column-gap: .5em; font-size: 1.2em;
    padding: .25em .6em; border-radius: .4em; border: 1px solid rgba(240,223,184,.14); }
  .row.turn { border-color: var(--ink-dim); background: rgba(255,255,255,.06); }
  .row .ico { width: 1.8em; height: 1.8em; border-radius: 50%; padding: .13em; background: radial-gradient(circle, var(--tile-a), var(--tile-b)); }
  .row .ico svg, .row .who svg { width: 100%; height: 100%; display: block; }
  .row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .who { font-style: italic; color: var(--ink-dim); font-size: .8em; text-align: center; }
  .row .who.hat { font-size: 1em; width: 2em; height: 2em; filter: drop-shadow(0 0 .6px var(--ink)) drop-shadow(0 0 .6px var(--ink)); }
  .row .pts { font-family: var(--font-display); font-size: 1.3em; line-height: 1; text-align: right; }
  .row .pts.bump { animation: bump .5s ease; }
  @keyframes bump { 40% { transform: scale(1.6); color: var(--accent); } }
  #draw { display: flex; flex-direction: column; align-items: center; gap: .35em; }
  #status { text-align: center; font-style: italic; font-size: 1.1em; line-height: 1.2; min-height: 1.2em; }
  #tray { width: calc(var(--s) * 1.12); height: calc(var(--s) * 1.12); border-radius: 8%; border: 1px solid rgba(240,223,184,.25); background: rgba(0,0,0,.25); }
  #stage.two #tray { width: calc(var(--s) * 2.18); }
  .float.hinted .face { animation: hinted 2.6s ease; }
  @keyframes hinted { 15%, 80% { box-shadow: 0 0 0 2px var(--accent), 0 0 18px var(--accent); } }
  .emblem { display: inline-block; width: 1.2em; height: 1.2em; filter: drop-shadow(0 0 .8px var(--ink)) drop-shadow(0 0 .8px var(--ink)) drop-shadow(0 0 .8px var(--ink)); }
  .emblem svg { display: block; width: 100%; height: 100%; }
  #result .emblem { width: 2.6em; height: 2.6em; }
  #result { display: flex; flex-direction: column; align-items: center; gap: .5em; }
  #result[hidden], #tray[hidden], #left[hidden], #status[hidden] { display: none; }
  #result h2 { font-family: var(--font-display); font-weight: normal; font-size: 2.2em; line-height: 1; margin: 0; }
  #result p { margin: -.3em 0 0; text-align: center; font-style: italic; font-size: 1em; line-height: 1.25; color: var(--ink-dim); }
  #b-again { background: var(--accent); color: var(--panel-ink); border-color: var(--accent); padding: .45em 1.2em; }
  #left { font-size: .9em; line-height: 1.2; color: var(--ink-dim); }
  #buttons { display: grid; grid-template-columns: 1fr 1fr; gap: .5em; }
  button { font: inherit; color: var(--ink); background: rgba(255,255,255,.07); border: 1px solid var(--ink-dim); border-radius: .4em;
    padding: .45em .3em; font-size: 1.05em; line-height: 1.2; white-space: nowrap; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .35; cursor: default; }

  @media (hover: hover) {
    button:not(:disabled):hover { background: rgba(255,255,255,.16); }
    #panel button:not(.card):hover { background: rgba(0,0,0,.14); }
    #panel button.card:hover { background: none; }
    .card:hover svg { transform: translateY(-.15em) scale(1.04); }
    .float.mine:hover .face { box-shadow: inset 0 0 0 1px var(--tile-edge), 0 4px 12px rgba(0,0,0,.6); }
  }
  #overlay { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; }
  #overlay[hidden] { display: none; }
  #panel { position: relative; background: var(--panel); color: var(--panel-ink); border-radius: .6em; padding: 1em 2.2em 1.1em;
    max-width: 90%; max-height: 96%; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.6); text-align: center; }
  #panel h2 { font-family: var(--font-display); font-weight: normal; font-size: 2.6em; margin: 0 0 .2em; letter-spacing: .04em; }
  #panel h3 { font-family: var(--font-display); font-weight: normal; font-size: 1.3em; margin: .7em 0 .35em; }
  #panel p { font-size: 1.15em; line-height: 1.3; margin: .4em 0; max-width: 38em; }
  #panel button { color: var(--panel-ink); border-color: var(--panel-ink); background: rgba(0,0,0,.06); margin: .2em; min-width: 6.5em; }
  #panel .big { font-size: 1.3em; }
  #panel.menu { background: none; box-shadow: none; color: var(--ink); max-width: 96%; min-width: 72%; padding: .6em 1.5em 1em; }
  #panel.menu h2 { font-size: 3.6em; margin-bottom: .25em; }
  #panel.menu #x { color: var(--ink); }
  .cards { display: flex; justify-content: center; gap: 2.2em; }
  .group { display: flex; gap: .9em; }
  .group button[data-act="side"] { width: 7em !important; margin: 0 .6em !important; }
  #panel button.card { display: flex; flex-direction: column; align-items: center; gap: .35em; background: none; border: none; padding: 0; margin: 0;
    min-width: 0; color: var(--ink); font-size: 1.2em; width: 5.6em; }
  .card small { font-size: .7em; font-style: italic; color: var(--ink-dim); margin-top: -.35em; white-space: nowrap; }
  .card svg { width: 100%; display: block; border-radius: 6%; box-shadow: 0 3px 10px rgba(0,0,0,.6); transition: transform .15s; }
  .card:active svg { transform: scale(.95); }
  .switch { margin-top: 1.3em; display: inline-flex; border: 1px solid var(--ink-dim); border-radius: .5em; overflow: hidden; }
  #panel.menu .switch button { margin: 0; border: none; border-radius: 0; color: var(--ink-dim); background: none; font-size: 1.05em; padding: .4em 1.1em; min-width: 0; }
  #panel.menu .switch button.on { background: var(--ink); color: var(--panel-ink); }
  #overlay.solid { background: none; }
  #stage.landing #board, #stage.landing #side { visibility: hidden; }
  #panel p.lore { font-style: italic; }
  #panel.rules { padding: .7em 2em .8em; max-width: 94%; }
  #panel.rules h2 { font-size: 1.9em; margin-bottom: .1em; }
  #panel.rules p { font-size: 1em; line-height: 1.25; margin: .3em 0; max-width: 44em; }
  #panel.rules .tileset { margin-top: .5em; }
  #panel.rules .kind { font-size: 1em; }
  #panel.rules .kind .face { width: 2.9em; height: 2.9em; }
  .tileset { display: flex; justify-content: center; gap: 1em; margin-top: .7em; }
  .kind { display: flex; flex-direction: column; align-items: center; gap: .2em; font-size: 1.15em; }
  .kind .face { width: 3.4em; height: 3.4em; }
  #x { position: absolute; right: .3em; top: .2em; border: none !important; background: none !important; font-size: 1.8em !important;
    line-height: 1; padding: .1em .3em !important; min-width: 0 !important; margin: 0 !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="board"><div id="inner"></div></div>
  <div id="side">
    <h1 id="t-title"></h1>
    <div id="scores">
      <div class="row" id="row-C"><span class="ico"></span><span class="nm"></span><span class="who"></span><span class="pts">0</span></div>
      <div class="row" id="row-V"><span class="ico"></span><span class="nm"></span><span class="who"></span><span class="pts">0</span></div>
    </div>
    <div id="draw"><div id="status"></div><div id="tray"></div><div id="left"></div><div id="result" hidden><div class="emblem"></div><h2></h2><p></p><button id="b-again"></button></div></div>
    <div id="buttons">
      <button id="b-hint"></button>
      <button id="b-rules"></button>
      <button id="b-menu" style="grid-column:1/3"></button>
    </div>
  </div>
  <div id="overlay" hidden><div id="panel"><button id="x" aria-label="Close">×</button><div id="panel-body"></div></div></div>
</div>
<script src="engine.js"></script>
<script src="net.js"></script>
<script src="ai.js"></script>
<script src="skins/classic/skin.js"></script>
<script src="ui.js"></script>
</body>
</html>
